<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fermeture">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Feuille de tâches</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1d1b;--mut:#6b675f;--line:#ddd8cc;--acc:#c8531a;--ok:#2f7d4f;--warn:#fff3cd;--bad:#b3261e;--badbg:#fdecea}
@media (prefers-color-scheme:dark){:root{--bg:#171715;--card:#222220;--ink:#f1eee6;--mut:#a39f94;--line:#3a3935;--warn:#4a3d12;--badbg:#4a1f1b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.4 -apple-system,system-ui,sans-serif;padding:0 0 env(safe-area-inset-bottom)}
.wrap{max-width:900px;margin:auto;padding:16px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--mut);margin-bottom:16px}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px calc(10px) 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.bar .in{max-width:900px;margin:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar b{flex:1;min-width:160px}
.prog{flex:2;min-width:180px;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
.cnt{font-variant-numeric:tabular-nums;min-width:70px;text-align:right}
button,select,input,textarea{font:inherit;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);padding:14px 20px;border-radius:12px;cursor:pointer;min-height:48px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.big{font-size:20px;padding:18px 24px;width:100%}
.btn:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.card h2{margin:0;padding:12px 16px;font-size:18px;background:var(--acc);color:#fff;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card h2 small{font-weight:400;opacity:.92;font-size:14px}
.card.fum h2{background:#3b6ea5}.card.comm h2{background:#555}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row input[type=checkbox]{flex:none;width:30px;height:30px;accent-color:var(--ok);margin-top:1px}
.row .t{flex:1}
.row.done .t{color:var(--mut);text-decoration:line-through}
.note{font-size:14px;color:var(--mut);display:block}
.tag{flex:none;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--ink);align-self:center;max-width:110px;text-align:center}
.rules{background:var(--warn);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:16px}
.rules summary{font-weight:700;cursor:pointer}
.rules div{margin-top:6px}
label.f{display:block;margin-bottom:14px;font-weight:600}
label.f span{display:block;font-size:14px;color:var(--mut);font-weight:400;margin-bottom:4px}
input[type=text],input[type=time],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px;min-height:48px}
textarea{min-height:90px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.models{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:640px){.models{grid-template-columns:1fr}}
.model{border:2px solid var(--line);border-radius:14px;padding:16px;background:var(--card);text-align:left;cursor:pointer}
.model.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(200,83,26,.25)}
.model b{display:block;font-size:20px}.model span{color:var(--mut);font-size:15px}
.pad{padding:16px}
.wl{display:grid;grid-template-columns:1fr 130px;gap:8px;padding:8px 14px;border-top:1px solid var(--line)}
.wl.h{font-size:13px;color:var(--mut);background:rgba(128,128,128,.12);border-top:0}
.err{background:var(--badbg);color:var(--bad);border:1px solid var(--bad);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.ok{background:#e6f4ea;color:#1e5e35;border:1px solid var(--ok);border-radius:12px;padding:12px 16px;margin-bottom:14px}
@media(prefers-color-scheme:dark){.ok{background:#173323;color:#9be0b4}}
.chk{display:flex;gap:12px;align-items:flex-start;margin:10px 0;cursor:pointer}
.chk input{width:30px;height:30px;flex:none;accent-color:var(--ok)}
.center{text-align:center;padding:40px 16px}
.center h1{font-size:30px}
.small{font-size:14px;color:var(--mut)}
</style>
</head>

/* =====================  OUTILS  ===================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function plain(html){const d=document.createElement('div');d.innerHTML=String(html).replace(/<span class='note'>/g,' — <span>').replace(/<br\s*\/?>/g,' ');return d.textContent.replace(/\s+/g,' ').trim()}
const QUI={A:"Explozone / Snack",B:"Magasin / Mini-golf",F:"Fumoir",Tous:"Tous"};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function sectionsFor(m){
  const data=m==='A'?A:B;
  return data.map((s,si)=>({
    key:m+si, title:s.t, sub:s.s||'', fum:!!s.fum, w:!!s.w, d:s.d||'',
    rows:(s.rows||[]).map((r,ri)=>{
      const arr=Array.isArray(r);
      return {key:m+si+'_'+ri, html:arr?r[1]:r, who:arr?r[0]:'', head:false};
    })
  }));
}

/* =====================  ÉTAT  ===================== */
const blank=()=>({step:'start',id:null,model:'B',commerce:LS.get('commerce',''),date:new Date().toISOString().slice(0,10),
  emp:['','',''],resp:'',heure:'',checks:{},comm:{},notes:'',fait:'',verif:'',seul:false,c1:false,c2:false,c3:false});
let S=Object.assign(blank(),LS.get('draft',{}));
function save(){LS.set('draft',S)}
function newSheet(){S=blank();save();render()}

/* =====================  ÉCRANS  ===================== */
function render(){
  const app=$('#app');
  if(S.step==='start')app.innerHTML=startHTML();
  else if(S.step==='list')app.innerHTML=listHTML();
  else app.innerHTML=doneHTML();
  window.scrollTo(0,0);
  bind();
}

function startHTML(){
  const pend=LS.get('pending',[]);
  return `<div class="wrap">
  <h1>Feuille de tâches</h1>
  <div class="sub">Remplis la feuille au fur et à mesure. Elle est envoyée par courriel à la direction quand tu appuies sur « Soumettre » le soir.</div>
  ${pend.length?`<div class="err"><b>${pend.length} feuille(s) en attente d'envoi</b> (pas de réseau).<br><button class="btn" id="retry" style="margin-top:8px">Réessayer l'envoi maintenant</button></div>`:''}
  <div class="models">
    <button class="model ${S.model==='A'?'on':''}" data-m="A"><b>Modèle A – 1 employé</b><span>Dimanche soir, lundi, mardi, mercredi</span></button>
    <button class="model ${S.model==='B'?'on':''}" data-m="B"><b>Modèle B – 2 à 3 employés</b><span>Jeudi, vendredi, samedi, dimanche (jour)</span></button>
  </div>
  <div class="card"><div class="pad">
    <label class="f"><span>Commerce</span><input type="text" id="commerce" value="${esc(S.commerce)}" placeholder="Ex. : Explozone"></label>
    <div class="grid">
      <label class="f"><span>Date</span><input type="text" id="date" value="${esc(S.date)}" readonly></label>
      <label class="f"><span>Heure de fermeture</span><input type="time" id="heure" value="${esc(S.heure)}"></label>
    </div>
    <label class="f"><span>Employé 1 (prénom et nom)</span><input type="text" data-emp="0" value="${esc(S.emp[0])}"></label>
    <label class="f"><span>Employé 2 (s'il y a lieu)</span><input type="text" data-emp="1" value="${esc(S.emp[1])}"></label>
    <label class="f"><span>Employé 3 (s'il y a lieu)</span><input type="text" data-emp="2" value="${esc(S.emp[2])}"></label>
    <label class="f"><span>Responsable du quart</span><input type="text" id="resp" value="${esc(S.resp)}"></label>
  </div></div>
  <div id="serr"></div>
  <button class="btn pri big" id="go">Commencer la feuille</button>
  </div>`;
}

function rulesHTML(){return `<details class="rules"><summary>Règles de base (toucher pour lire)</summary>${RULES.map(r=>`<div>• ${esc(r)}</div>`).join('')}</details>`}

function stats(){
  let tot=0,done=0;
  sectionsFor(S.model).forEach(s=>{if(!s.w)s.rows.forEach(r=>{tot++;if(S.checks[r.key])done++})});
  return {tot,done};
}

function listHTML(){
  const secs=sectionsFor(S.model);
  const st=stats();
  const body=secs.map(s=>{
    if(s.w){
      const rows=[0,1,2,3].map(i=>{const v=(S.comm[s.key]||[])[i]||{d:'',w:''};
        return `<div class="wl"><input type="text" data-c="${s.key}" data-i="${i}" data-f="d" value="${esc(v.d)}"><input type="text" data-c="${s.key}" data-i="${i}" data-f="w" value="${esc(v.w)}" placeholder="Initiales"></div>`}).join('');
      return `<div class="card comm"><h2><span>${esc(s.title)}</span><small>${esc(s.sub)}</small></h2><div class="wl h"><span>${esc(s.d||'Produit / descriptif')}</span><span>Écrit par</span></div>${rows}</div>`;
    }
    return `<div class="card ${s.fum?'fum':''}"><h2><span>${esc(s.title)}</span><small>${esc(s.sub)}</small></h2>${s.rows.map(r=>`
      <label class="row ${S.checks[r.key]?'done':''}"><input type="checkbox" data-k="${r.key}" ${S.checks[r.key]?'checked':''}><span class="t">${r.html}</span>${r.who?`<span class="tag">${QUI[r.who]||r.who}</span>`:''}</label>`).join('')}</div>`;
  }).join('');
  const empOpts=sel=>`<option value="">— choisir —</option>`+S.emp.filter(x=>x.trim()).map(n=>`<option ${sel===n?'selected':''}>${esc(n)}</option>`).join('');
  const B_=S.model==='B';
  return `<div class="bar"><div class="in"><b>${S.model==='A'?'Modèle A – 1 employé':'Modèle B – 2-3 employés'} · ${esc(S.commerce)}</b><div class="prog"><i id="pbar" style="width:${st.tot?Math.round(100*st.done/st.tot):0}%"></i></div><span class="cnt" id="pcnt">${st.done} / ${st.tot}</span></div></div>
  <div class="wrap">
  ${rulesHTML()}
  ${body}
  <div class="card"><h2><span>Double vérification et soumission</span><small>dernière étape</small></h2><div class="pad">
    <div class="grid">
      <label class="f"><span>Tâches faites par</span><select id="fait">${empOpts(S.fait)}</select></label>
      <label class="f"><span>Vérifié par (la collègue)</span><select id="verif" ${S.seul?'disabled':''}>${empOpts(S.verif)}</select></label>
    </div>
    ${B_?`<label class="chk"><input type="checkbox" id="seul" ${S.seul?'checked':''}><span>Je suis seul(e) ce soir : pas de collègue pour vérifier</span></label>`:''}
    <label class="chk"><input type="checkbox" id="c1" ${S.c1?'checked':''}><span><b>Toutes les tâches du close sont complétées</b> avant le départ de la première personne</span></label>
    ${B_?`<label class="chk"><input type="checkbox" id="c2" ${S.c2?'checked':''}><span><b>La collègue a revérifié chaque tâche</b> avant de quitter (tour des zones fait ensemble)</span></label>`:''}
    <label class="chk"><input type="checkbox" id="c3" ${S.c3?'checked':''}><span><b>Aucune lumière allumée</b> (salle électrique, escape game arrière), enveloppes au coffre</span></label>
    <label class="f" style="margin-top:14px"><span>Notes pour la direction et pour la personne du lendemain (obligatoire si des tâches ne sont pas faites : dis pourquoi)</span><textarea id="notes">${esc(S.notes)}</textarea></label>
    <div id="serr"></div>
    <button class="btn pri big" id="submit">Soumettre la feuille</button>
    <p class="small">La feuille est envoyée par courriel à la direction. Tu ne peux pas la modifier après l'envoi.</p>
    <button class="btn" id="back" style="margin-top:8px">← Modifier les noms ou le modèle</button>
  </div></div>
  </div>`;
}

function doneHTML(){
  return `<div class="wrap center"><h1>✔ Feuille envoyée</h1><p>Merci ! La direction a reçu la feuille de fermeture par courriel.</p><button class="btn pri big" id="newb" style="max-width:400px">Nouvelle feuille</button></div>`;
}

/* =====================  LOGIQUE  ===================== */
function bind(){
  const app=$('#app');
  app.querySelectorAll('.model').forEach(b=>b.onclick=()=>{S.model=b.dataset.m;save();render()});
  const g=$('#go');if(g)g.onclick=()=>{
    S.commerce=$('#commerce').value.trim();S.heure=$('#heure').value;S.resp=$('#resp').value.trim();
    app.querySelectorAll('[data-emp]').forEach(i=>S.emp[+i.dataset.emp]=i.value.trim());
    const miss=[];if(!S.commerce)miss.push('le nom du commerce');if(!S.emp[0])miss.push('au moins un employé');if(!S.resp)miss.push('le responsable du quart');
    if(miss.length){$('#serr').innerHTML=`<div class="err">Il manque : ${miss.join(', ')}.</div>`;return}
    LS.set('commerce',S.commerce);S.step='list';S.id=S.id||(Date.now().toString(36)+Math.random().toString(36).slice(2,7));save();render();
  };
  const r=$('#retry');if(r)r.onclick=()=>flushPending(true);
  app.querySelectorAll('input[data-k]').forEach(c=>c.onchange=()=>{
    S.checks[c.dataset.k]=c.checked;c.closest('.row').classList.toggle('done',c.checked);save();
    const st=stats();$('#pbar').style.width=(st.tot?Math.round(100*st.done/st.tot):0)+'%';$('#pcnt').textContent=st.done+' / '+st.tot;
  });
  app.querySelectorAll('input[data-c]').forEach(i=>i.oninput=()=>{
    const k=i.dataset.c,ix=+i.dataset.i;S.comm[k]=S.comm[k]||[{},{},{},{}];S.comm[k][ix]=S.comm[k][ix]||{};S.comm[k][ix][i.dataset.f]=i.value;save();
  });
  const f=$('#fait');if(f)f.onchange=()=>{S.fait=f.value;save()};
  const v=$('#verif');if(v)v.onchange=()=>{S.verif=v.value;save()};
  const se=$('#seul');if(se)se.onchange=()=>{S.seul=se.checked;if(S.seul){S.verif='';S.c2=false}save();render()};
  ['c1','c2','c3'].forEach(id=>{const e=$('#'+id);if(e)e.onchange=()=>{S[id]=e.checked;save()}});
  const n=$('#notes');if(n)n.oninput=()=>{S.notes=n.value;save()};
  const bk=$('#back');if(bk)bk.onclick=()=>{S.step='start';save();render()};
  const sb=$('#submit');if(sb)sb.onclick=submit;
  const nb=$('#newb');if(nb)nb.onclick=newSheet;
}

function buildPayload(){
  const secs=sectionsFor(S.model);
  const items=[],comm=[];let tot=0,done=0;
  secs.forEach(s=>{
    if(s.w){
      const rows=(S.comm[s.key]||[]).filter(r=>r&&((r.d||'').trim()||(r.w||'').trim())).map(r=>({d:(r.d||'').trim(),w:(r.w||'').trim()}));
      comm.push({title:s.title,sub:s.sub,rows});
    }else{
      items.push({title:s.title,rows:s.rows.map(r=>{tot++;const c=!!S.checks[r.key];if(c)done++;return {text:plain(r.html),who:QUI[r.who]||'',checked:c}})});
    }
  });
  return {id:S.id,version:APP_VERSION,sentAt:new Date().toISOString(),model:S.model,
    modelLabel:S.model==='A'?'Modèle A – 1 employé':'Modèle B – 2 à 3 employés',
    commerce:S.commerce,date:S.date,heure:S.heure,employes:S.emp.filter(x=>x.trim()),responsable:S.resp,
    faitPar:S.fait,verifiePar:S.seul?'(employé seul)':S.verif,seul:S.seul,
    confirmations:{tachesCompletees:S.c1,collegueAVerifie:S.seul?null:S.c2,lumieresEtCoffre:S.c3},
    notes:S.notes.trim(),total:tot,faites:done,sections:items,communication:comm};
}

async function submit(){
  const miss=[];const st=stats();
  if(!S.fait)miss.push('« Tâches faites par »');
  if(S.model==='B'&&!S.seul){
    if(!S.verif)miss.push('« Vérifié par » (la collègue)');
    else if(S.verif===S.fait)miss.push('« Vérifié par » doit être une autre personne que « Faites par »');
    if(!S.c2)miss.push('la confirmation de revérification par la collègue');
  }
  if(!S.c1)miss.push('la confirmation que toutes les tâches du close sont complétées');
  if(!S.c3)miss.push('la confirmation des lumières et des enveloppes');
  if(st.done<st.tot&&!S.notes.trim())miss.push(`une note qui explique pourquoi ${st.tot-st.done} tâche(s) ne sont pas cochées`);
  if(miss.length){$('#serr').innerHTML=`<div class="err"><b>Impossible de soumettre. Il manque :</b><br>• ${miss.join('<br>• ')}</div>`;$('#serr').scrollIntoView({behavior:'smooth',block:'center'});return}
  const btn=$('#submit');btn.disabled=true;btn.textContent='Envoi en cours…';
  const payload=buildPayload();
  const ok=await send(payload);
  if(ok){localStorage.removeItem('draft');S=blank();S.step='done';render()}
  else{
    const p=LS.get('pending',[]);p.push(payload);LS.set('pending',p);
    localStorage.removeItem('draft');S=blank();S.step='start';render();
    $('#serr').innerHTML=`<div class="err"><b>Pas de réseau ou envoi impossible.</b> La feuille est gardée sur cet iPad et sera renvoyée automatiquement. Ne la refaites pas.</div>`;
  }
}

async function send(payload){
  if(!ENDPOINT)return false;
  try{
    await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    return true;
  }catch(e){return false}
}
async function flushPending(manual){
  const p=LS.get('pending',[]);if(!p.length)return;
  const left=[];
  for(const x of p){if(!(await send(x)))left.push(x)}
  LS.set('pending',left);
  if(S.step==='start')render();
}
window.addEventListener('online',()=>flushPending(false));
setInterval(()=>flushPending(false),120000);
if(S.step==='done')S.step='start';
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
